<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram P2P Marketplace</title>
    <!-- Include Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 16px;
        }
        h2 { font-size: 20px; margin-bottom: 10px; }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f1f1f1);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
            cursor: pointer;
            margin-top: 5px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin: 6px 0 12px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="user-info"></div>

    <h2>Create Sell Ad</h2>
    <div class="card">
        <label>USDT Amount:</label>
        <input type="number" id="adAmount" placeholder="100">
        <label>Price per USDT (ETB):</label>
        <input type="number" id="adPrice" placeholder="120">
        <label>Payment Method:</label>
        <select id="adPayment">
            <option value="Telebirr">Telebirr</option>
            <option value="CBE Birr">CBE Birr</option>
        </select>
        <button onclick="createAd()">Post Ad</button>
    </div>

    <h2>Active Market Ads</h2>
    <div id="ads-container">Loading ads...</div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // TODO: Paste your Google Apps Script Web App URL here
        const API_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

        // Get user data from Telegram
        const user = tg.initDataUnsafe?.user;
        const telegramId = user ? user.id : 'TEST_USER_123';
        const firstName = user ? user.first_name : 'Test User';

        document.getElementById('user-info').innerHTML = `
            <div class="card"><b>Welcome,</b> ${firstName} (ID: ${telegramId})</div>
        `;

        // Fetch active ads on load
        window.onload = fetchAds;

        async function fetchAds() {
            try {
                // Apps Script requires GET or POST. Since doPost handles actions, we send a fetch request.
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_active_ads' })
                });
                const result = await response.json();
                
                const container = document.getElementById('ads-container');
                if (result.status === 'success' && result.data.length > 0) {
                    container.innerHTML = '';
                    result.data.forEach(ad => {
                        container.innerHTML += `
                            <div class="card">
                                <b>Sell:</b> ${ad.Amount} USDT <br>
                                <b>Price:</b> ${ad.Price} ETB / USDT <br>
                                <b>Method:</b> ${ad.Payment Method} <br>
                                <button onclick="buyAd('${ad.Ad ID}', ${ad.Amount}, ${ad.Price})">Buy Now</button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = '<p>No active ads available right now.</p>';
                }
            } catch (err) {
                document.getElementById('ads-container').innerHTML = '<p>Error loading ads.</p>';
            }
        }

        async function createAd() {
            const amount = document.getElementById('adAmount').value;
            const price = document.getElementById('adPrice').value;
            const paymentMethod = document.getElementById('adPayment').value;

            if (!amount || !price) {
                alert('Please fill in all fields');
                return;
            }

            const payload = {
                action: 'create_ad',
                payload: {
                    sellerId: telegramId,
                    asset: 'USDT',
                    amount: parseFloat(amount),
                    fiatCurrency: 'ETB',
                    price: parseFloat(price),
                    paymentMethod: paymentMethod
                }
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.status === 'success') {
                    alert('Ad created successfully!');
                    fetchAds();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                alert('Network error while posting ad.');
            }
        }

        function buyAd(adId, amount, price) {
            const fiatTotal = amount * price;
            if (confirm(`Do you want to buy ${amount} USDT for ${fiatTotal} ETB?`)) {
                alert(`Order initiated for Ad ${adId}. Next step: Seller locks USDT into escrow.`);
                // Here is where you would trigger the ethers.js smart contract lock function!
            }
        }
    </script>
</body>
</html>
